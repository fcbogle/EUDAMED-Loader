entity_name: Manufacturer
entity_path: manufacturer
qms_decision:
  status: accepted_with_note
  rationale: Manufacturer context is retained for traceability and to support device-level UDI-DI interpretation.
assumptions:
  - Manufacturer data is supporting context for the first UDI-DI load rather than the primary payload focus.
field_reviews:
  - mapping:
      canonical_path: manufacturer.issuing_entity
      business_label: Issuing Entity
      classification: direct
      source_columns:
        - Issuing Entity e.g. GS1
      assumptions:
        - The workbook template already uses the EUDAMED-facing issuing entity concept.
      schema_targets:
        - schema_path: UDIDIType/udiDiCode/issuingEntity
          required: true
          status: direct
          notes: Confirm the final schema path during XML implementation.
      example_source_values:
        - GS1
      example_canonical_value: GS1
    decision:
      status: accepted
      rationale: Direct template-aligned field.
  - mapping:
      canonical_path: manufacturer.manufacturer_srn
      business_label: Manufacturer SRN
      classification: derived
      derivation_logic: Resolve from the legacy tracekey Basic UDI workbook as a supplemental SRN source after variant-level join.
      assumptions:
        - The workbook rows do not carry the SRN directly.
        - The current authoritative BasicUDIs.xlsx workbook does not carry manufacturer SRN.
        - QMS confirmed the legacy tracekey manufacturer SRN is valid for all in-scope product families.
      schema_targets:
        - schema_path: BasicUDIType/MFActorCode
          required: true
          status: derived
          notes: Required by `MDRBasicUDI`; currently supplemented from `uat-eudamed_mdr_products_tracekey_sample_data.xlsx!MDR-Basic Manufacturer Code`.
    decision:
      status: accepted_with_note
      rationale: Keep the field explicit while using the legacy tracekey workbook as a narrow supplemental SRN source.
  - mapping:
      canonical_path: manufacturer.designed_by_another_legal_entity
      business_label: Designed By Another Legal Entity
      classification: direct
      source_columns:
        - Is the device designed and manufactured by another legal or natural person? E.g. NO
      schema_targets:
        - schema_path: UDIDIType/designedManufacturedByAnotherPersonIndicator
          required: true
          status: direct
          notes: Boolean indicator expected to map directly after workbook parsing.
      example_source_values:
        - "NO"
      example_canonical_value: "false"
    decision:
      status: accepted
      rationale: Direct boolean-style workbook field.
