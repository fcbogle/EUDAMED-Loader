  - mapping:
      canonical_path: device_record.reprocessed_single_use
      business_label: Reprocessed Single Use Device
      classification: direct
      source_columns:
        - Reprocessed single use device e.g. NO
      schema_targets:
        - schema_path: UDIDIType/reprocessedSingleUseIndicator
          required: true
          status: direct
