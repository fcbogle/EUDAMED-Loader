  - mapping:
      canonical_path: basic_device.device_model_applicable
      business_label: Device Model Applicable
      classification: derived
      derivation_logic: Preserve the BasicUDIs.xlsx `Device model applicable` flag as reviewable canonical metadata.
      assumptions:
        - This is an applicability/control field rather than a direct current schema payload field.
      schema_targets:
        - schema_path: BasicUDIType/model
          required: false
          status: derived
          notes: Used to document whether model text is considered applicable in the source workbook.
      example_canonical_value: "true"
    decision:
      status: accepted_with_note
      rationale: Preserve the source control field even though it is not itself the schema target.
  - mapping:
      canonical_path: basic_device.additional_information_url
      business_label: Additional Information URL
      classification: derived
      source_columns:
        - 'URL for additional information (as electronic instructions for use):'
      schema_targets:
        - schema_path: UDIDIType/website
          required: false
          status: derived
          notes: Manufacturer website where additional information about the device (UDI-DI) are available.
      example_canonical_value: www.blatchfordmobility.com/en-gb/for-professionals/technical-documentation/
    decision:
      status: accepted
      rationale: The local UDIDI schema includes a direct website field for additional device information.
  - mapping:
      canonical_path: basic_device.submission_operation
      business_label: Submission Operation
      classification: derived
      source_columns:
        - Operation
      schema_targets:
        - schema_path: ServiceType/serviceOperation
          required: true
          status: derived
          notes: Service-envelope metadata that determines variant-scoped XML create vs update behavior.
      example_canonical_value: POST
    decision:
      status: accepted_with_note
      rationale: The new Basic UDI workbook carries explicit submission intent per variant.
  - mapping:
      canonical_path: basic_device.source_version_marker
      business_label: Source Version Marker
      classification: derived
      source_columns:
        - Version
      assumptions:
        - This is currently treated as internal workbook metadata rather than authoritative EUDAMED entity version.
      schema_targets:
        - schema_path: Entity/version
          required: false
          status: gap
          notes: Preserve separately until QMS or official guidance confirms whether it should populate the XML entity version.
      example_canonical_value: "1"
    decision:
      status: accepted_with_note
      rationale: Preserve the source convention without yet treating it as authoritative entity-version output.
  - mapping:
