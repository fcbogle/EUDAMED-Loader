entity_name: BasicDevice
entity_path: basic_device
qms_decision:
  status: accepted_with_note
  rationale: Basic UDI context remains in the canonical layer even though the first upload is UDI-DI only.
assumptions:
  - Basic UDI records already exist outside this first upload flow.
  - Basic device fields are retained for linkage, audit, and future schema projection.
field_reviews:
  - mapping:
      canonical_path: basic_device.basic_udi_di
      business_label: Basic UDI-DI
      classification: derived
      derivation_logic: Resolve from the previously registered Basic UDI reference list instead of the current workbook rows.
      assumptions:
        - Absence from the current workbook set is not treated as a first-phase upload omission by default.
        - The required value should already exist in the prior Basic UDI registration dataset used for lookup.
      schema_targets:
        - schema_path: UDIDIType/basicUdiDiId
          required: true
          status: derived
          notes: Required relationship context for UDI-DI projection.
    decision:
      status: accepted_with_note
      rationale: Needed for linkage and upload, but expected to come from the previously registered Basic UDI reference list rather than the first-load spreadsheet.
  - mapping:
      canonical_path: basic_device.regulation
      business_label: Regulation
      classification: derived
      derivation_logic: Set from confirmed project scope configuration.
      assumptions:
        - QMS confirmed the first release is MDR only.
      schema_targets:
        - schema_path: UDIDIType/regulation
          required: true
          status: derived
          notes: Source of truth should move to explicit configuration later.
      example_canonical_value: MDR
    decision:
      status: accepted
      rationale: Confirmed scope assumption from QMS.
  - mapping:
      canonical_path: basic_device.nomenclature_code
      business_label: EMDN Code
      classification: direct
      source_columns:
        - Enter a nomenclature code (EMDN code) e.g starts with Y06xxxx then click Find
      schema_targets:
        - schema_path: UDIDIType/emdnCode
          required: true
          status: direct
          notes: Template-aligned nomenclature field.
      example_source_values:
        - Y061234
      example_canonical_value: Y061234
    decision:
      status: accepted
      rationale: Direct schema-facing workbook field.
  - mapping:
      canonical_path: basic_device.intended_purpose_summary
      business_label: Intended Purpose Summary
      classification: gap
      assumptions:
        - No dedicated narrative intended-purpose field has been confirmed in the workbook set.
      schema_targets:
        - schema_path: UDIDIType/intendedPurpose
          required: false
          status: gap
          notes: Keep visible for future enrichment if XML projection needs narrative support.
    decision:
      status: accepted_with_note
      rationale: Visible gap retained for audit even though not currently evidenced.
  - mapping:
      canonical_path: basic_device.annex_xvi_other_purpose
      business_label: Annex XVI Other Purpose
      classification: direct
      source_columns:
        - Intended purpose other than medical (Annex XVI) e.g. NO
      schema_targets:
        - schema_path: UDIDIType/annexXviOtherPurposeIndicator
          required: true
          status: direct
          notes: Boolean-style workbook field.
      example_source_values:
        - "NO"
      example_canonical_value: "false"
    decision:
      status: accepted
      rationale: Direct template field.
  - mapping:
      canonical_path: basic_device.clinical_investigation
      business_label: Clinical Investigation
      classification: direct
      source_columns:
        - Clinical Investigation e.g. NO
      schema_targets:
        - schema_path: UDIDIType/clinicalInvestigationIndicator
          required: true
          status: direct
          notes: Boolean-style workbook field.
      example_source_values:
        - "NO"
      example_canonical_value: "false"
    decision:
      status: accepted
      rationale: Direct template field.
  - mapping:
      canonical_path: basic_device.risk_class
      business_label: Basic Risk Class
      classification: derived
      derivation_logic: Resolve from the Echelon Basic UDI reference workbook (`MDR-Basic!Risk Class`).
      schema_targets:
        - schema_path: BasicUDIType/riskClass
          required: true
          status: derived
          notes: Required by `MDRBasicUDI`.
      example_canonical_value: CLASS_I
    decision:
      status: accepted_with_note
      rationale: Required for XML generation and currently sourced from the Basic UDI reference workbook.
  - mapping:
      canonical_path: basic_device.model
      business_label: Basic Model
      classification: derived
      derivation_logic: Resolve from `MDR-Basic!Model` and project into the `modelName/model` structure for `MDRBasicUDI`.
      schema_targets:
        - schema_path: BasicUDIType/modelName/model
          required: false
          status: derived
          notes: Included when the Basic UDI reference workbook provides the device model text.
      example_canonical_value: tracekey Instruments Ir
    decision:
      status: accepted_with_note
      rationale: The current Echelon XML path uses the Basic UDI reference workbook for this value.
  - mapping:
      canonical_path: basic_device.model_name
      business_label: Basic Model Name
      classification: derived
      derivation_logic: Resolve from `MDR-Basic!Model Name`.
      schema_targets:
        - schema_path: BasicUDIType/modelName/name
          required: true
          status: derived
          notes: Required by `MDRBasicUDI`.
      example_canonical_value: Echelon
    decision:
      status: accepted_with_note
      rationale: Required for XML generation and currently sourced from the Basic UDI reference workbook.
  - mapping:
      canonical_path: basic_device.identifier
      business_label: Basic Identifier
      classification: derived
      derivation_logic: Compose a DI identifier from `Products!Product Code (Value)` and the workbook issuing entity.
      assumptions:
        - The shared Echelon family uses the same issuing entity for the Basic and UDI-DI identifiers.
      schema_targets:
        - schema_path: BasicUDIType/identifier
          required: true
          status: derived
          notes: Rendered as a `DIIdentifierType` with `DICode` and `issuingEntityCode`.
      example_canonical_value: GS1:5050649ECHELONMV
    decision:
      status: accepted_with_note
      rationale: This is derived from the Basic UDI reference workbook plus issuing-entity context from the source template.
  - mapping:
      canonical_path: basic_device.authorised_representative_srn
      business_label: Authorised Representative SRN
      classification: derived
      derivation_logic: Resolve from `MDR-Basic!Authorised Representative Actor Code`.
      schema_targets:
        - schema_path: DeviceBasicUDIType/ARActorCode
          required: false
          status: derived
          notes: Present for Echelon and included in the first XML path.
      example_canonical_value: DE-AR-000006292
    decision:
      status: accepted_with_note
      rationale: The first XML path sources this from the Basic UDI reference workbook.
  - mapping:
      canonical_path: basic_device.animal_tissues_cells
      business_label: Basic Animal Tissues Cells
      classification: derived
      derivation_logic: Use `MDR-Basic!Animal Tissues Cells` for the Basic UDI projection.
      schema_targets:
        - schema_path: DeviceBasicUDIType/animalTissuesCells
          required: true
          status: derived
          notes: XML generation prefers the Basic UDI reference value over the workbook prompt.
      example_canonical_value: "false"
    decision:
      status: accepted_with_note
      rationale: Current XML generation uses the Basic UDI reference workbook as the source of truth.
  - mapping:
