entity_name: BasicDevice
entity_path: basic_device
qms_decision:
  status: accepted_with_note
  rationale: Basic UDI context remains in the canonical layer even though the first upload is UDI-DI only, and is now resolved per product variant.
assumptions:
  - The authoritative Basic UDI source is data/basic_udi_reference/BasicUDIs.xlsx.
  - Basic UDI records remain contextual for the current manual-upload flow, but they are no longer modeled as one shared family bundle.
  - Workbook sheet name is the primary variant-level join key for the in-scope family workbooks.
  - Template for Accessories_Footspares EUDAMED.xlsx remains excluded from active Basic UDI variant mapping until QMS clarification is received.
field_reviews:
  - mapping:
      canonical_path: basic_device.basic_udi_di
      business_label: Basic UDI-DI
      classification: derived
      derivation_logic: Resolve from the authoritative BasicUDIs.xlsx workbook using the source sheet name as the primary Device Model join key.
      assumptions:
        - In-scope family workbook sheets map to specific BasicUDI rows rather than inheriting one family-level Basic UDI context.
      schema_targets:
        - schema_path: UDIDIType/basicUdiDiId
          required: true
          status: derived
          notes: Required relationship context for UDI-DI projection.
    decision:
      status: accepted_with_note
      rationale: Needed for linkage and upload, and now expected to come from the authoritative variant-level Basic UDI workbook.
  - mapping:
      canonical_path: basic_device.regulation
      business_label: Regulation
      classification: derived
      derivation_logic: Set from confirmed project scope configuration.
      assumptions:
        - QMS confirmed the first release is MDR only.
      schema_targets:
        - schema_path: UDIDIType/regulation
          required: true
          status: derived
          notes: Source of truth should move to explicit configuration later.
      example_canonical_value: MDR
    decision:
      status: accepted
      rationale: Confirmed scope assumption from QMS.
  - mapping:
      canonical_path: basic_device.nomenclature_code
      business_label: EMDN Code
      classification: direct
      source_columns:
        - Enter a nomenclature code (EMDN code) e.g starts with Y06xxxx then click Find
      schema_targets:
        - schema_path: UDIDIType/emdnCode
          required: true
          status: direct
          notes: Template-aligned nomenclature field.
      example_source_values:
        - Y061234
      example_canonical_value: Y061234
    decision:
      status: accepted
      rationale: Direct schema-facing workbook field.
  - mapping:
      canonical_path: basic_device.intended_purpose_summary
      business_label: Intended Purpose Summary
      classification: gap
      assumptions:
        - No dedicated narrative intended-purpose field has been confirmed in the workbook set.
      schema_targets:
        - schema_path: UDIDIType/intendedPurpose
          required: false
          status: gap
          notes: Keep visible for future enrichment if XML projection needs narrative support.
    decision:
      status: accepted_with_note
      rationale: Visible gap retained for audit even though not currently evidenced.
  - mapping:
      canonical_path: basic_device.annex_xvi_other_purpose
      business_label: Annex XVI Other Purpose
      classification: direct
      source_columns:
        - Intended purpose other than medical (Annex XVI) e.g. NO
      schema_targets:
        - schema_path: UDIDIType/annexXviOtherPurposeIndicator
          required: true
          status: direct
          notes: Boolean-style workbook field.
      example_source_values:
        - "NO"
      example_canonical_value: "false"
    decision:
      status: accepted
      rationale: Direct template field.
  - mapping:
      canonical_path: basic_device.clinical_investigation
      business_label: Clinical Investigation
      classification: direct
      source_columns:
        - Clinical Investigation e.g. NO
      schema_targets:
        - schema_path: UDIDIType/clinicalInvestigationIndicator
          required: true
          status: direct
          notes: Boolean-style workbook field.
      example_source_values:
        - "NO"
      example_canonical_value: "false"
    decision:
      status: accepted
      rationale: Direct template field.
  - mapping:
      canonical_path: basic_device.risk_class
      business_label: Basic Risk Class
      classification: derived
      derivation_logic: Resolve from BasicUDIs.xlsx `Risk class` after variant-level join.
      schema_targets:
        - schema_path: BasicUDIType/riskClass
          required: true
          status: derived
          notes: Required by `MDRBasicUDI`.
      example_canonical_value: CLASS_I
    decision:
      status: accepted_with_note
      rationale: Required for XML generation and now sourced from the authoritative Basic UDI workbook.
  - mapping:
      canonical_path: basic_device.device_model
      business_label: Basic Device Model
      classification: derived
      derivation_logic: Resolve from BasicUDIs.xlsx `Device Model` after variant-level join.
      schema_targets:
        - schema_path: BasicUDIType/model
          required: true
          status: derived
          notes: Use as the variant identity and as the business basis for later XML grouping.
      example_canonical_value: Echelon VT
    decision:
      status: accepted_with_note
      rationale: The new Basic UDI workbook provides explicit per-variant model identity.
  - mapping:
      canonical_path: basic_device.device_type
      business_label: Basic Device Type
      classification: derived
      derivation_logic: Derive from BasicUDIs.xlsx `Is it a System or Procedure Pack which is a Device in itself?` using the EUDAMED DEVICE / PROCEDURE_PACK / SYSTEM enum semantics.
      schema_targets:
        - schema_path: MDRBasicUDIType/type
          required: true
          status: derived
          notes: Required to distinguish device-level variants from system/procedure-pack records.
      example_canonical_value: DEVICE
    decision:
      status: accepted_with_note
      rationale: The source workbook carries the applicability prompt, but the canonical field should store the schema-facing type meaning.
  - mapping:
      canonical_path: basic_device.special_device_type
      business_label: Basic Special Device Type
      classification: derived
      derivation_logic: Resolve from BasicUDIs.xlsx `Special device type`.
      schema_targets:
        - schema_path: MDRBasicUDIType/specialDevice
          required: false
          status: derived
          notes: Optional enum-like property for the MDR Basic UDI model.
      example_canonical_value: null
    decision:
      status: accepted_with_note
      rationale: Keep explicit because the new workbook carries this as authoritative Basic UDI content.
  - mapping:
      canonical_path: basic_device.authorised_representative_srn
      business_label: Authorised Representative SRN
      classification: derived
      derivation_logic: Resolve from the legacy tracekey Basic UDI workbook as a supplemental SRN source after variant-level join.
      assumptions:
        - The current authoritative BasicUDIs.xlsx workbook does not carry authorised representative SRN.
        - QMS confirmed the legacy tracekey authorised representative SRN is valid for all in-scope product families.
      schema_targets:
        - schema_path: BasicUDIType/ARActorCode
          required: false
          status: derived
          notes: Optional in `MDRBasicUDI`; currently supplemented from `uat-eudamed_mdr_products_tracekey_sample_data.xlsx!MDR-Basic Authorised Representative Actor Code`.
      example_canonical_value: DE-AR-000006292
    decision:
      status: accepted_with_note
      rationale: Keep the field explicit while using the legacy tracekey workbook as a narrow supplemental SRN source.
  - mapping:
      canonical_path: basic_device.implantable
      business_label: Basic Implantable
      classification: derived
      derivation_logic: Resolve from BasicUDIs.xlsx `Implantable`.
      schema_targets:
        - schema_path: CommonDeviceType/implantable
          required: true
          status: derived
          notes: One of the MDR applicable properties carried at Basic UDI level.
      example_canonical_value: "false"
    decision:
      status: accepted_with_note
      rationale: The new Basic UDI workbook exposes the value directly at variant level.
  - mapping:
      canonical_path: basic_device.measuring_function
